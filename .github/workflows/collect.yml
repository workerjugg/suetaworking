name: collect-and-publish

on:
  schedule:
    - cron: "17 */6 * * *"      # каждые 6 часов; ~4 запуска/сутки, укладывается в бесплатные лимиты
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guardian
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Install sing-box (official release)
        continue-on-error: true      # без sing-box работает только TCP-проверка
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/install_singbox.sh
      - name: Restore last good state
        uses: actions/cache/restore@v4
        with:
          path: |
            subscriptions
            data
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Collect, check, generate
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}   # необязательно
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}       # необязательно
        run: python main.py
      - name: Save last good state
        uses: actions/cache/save@v4
        with:
          path: |
            subscriptions
            data
          key: state-${{ github.run_id }}
      - name: Prepare site
        env:
          SUB_TOKEN: ${{ secrets.SUB_TOKEN }}   # секретная папка; если не задан — сайт публичный в корне
        run: |
          mkdir -p _site
          if [ -n "$SUB_TOKEN" ]; then
            base="_site/$SUB_TOKEN"
            mkdir -p "$base"
            printf '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>404</title>Not found' > _site/index.html
          else
            base="_site"
          fi
          cp -r subscriptions "$base/subscriptions" 2>/dev/null || true
          cp -r dashboard/* "$base/"
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
      - name: Alert on critical (GitHub emails you about a failed run)
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("data/last_run.json"))
          if d.get("critical"):
              print("CRITICAL:", d.get("events")); sys.exit(1)
          EOF
